<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marvel Pixel Royale — Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=16">
</head>
<body>
<canvas id="fx"></canvas>

<header id="topbar">
  <div id="logo">
    <span class="l1 pix">MARVEL</span>
    <span class="l2">PIXEL ROYALE</span>
  </div>
  <nav id="tabs"></nav>
  <div id="hud">
    <div id="coinPill" title="Coins">
      <img id="coinIcon" class="pixel" src="assets/spr/coin.png?v=16" alt="coin" width="18" height="18">
      <span id="coinCount">0</span>
    </div>
    <button id="settingsBtn" class="iconbtn" title="Settings">⚙</button>
  </div>
</header>

<main id="screen"></main>

<div id="toasts"></div>
<div id="modalRoot"></div>

<script type="module" src="js/main.js?v=16"></script>
</body>
</html>
