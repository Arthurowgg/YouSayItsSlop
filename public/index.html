<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marvel Pixel Royale — Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="fx"></canvas>

<header id="topbar">
  <div id="logo">
    <span class="l1 pix">MARVEL</span>
    <span class="l2">PIXEL ROYALE</span>
  </div>
  <nav id="tabs"></nav>
  <div id="hud">
    <div id="coinPill" title="Coins">
      <img id="coinIcon" class="pixel" src="assets/spr/coin.png" alt="coin" width="18" height="18">
      <span id="coinCount">0</span>
    </div>
    <button id="settingsBtn" class="iconbtn" title="Settings">⚙</button>
  </div>
</header>

<main id="screen"></main>

<div id="toasts"></div>
<div id="modalRoot"></div>
<footer id="foot">
  FAN-MADE TEST BUILD — Marvel &amp; characters © Marvel/Disney. Prototype for private testing; license required for release.
</footer>

<script type="module" src="js/main.js"></script>
</body>
</html>
