<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marvel Pixel Royale — Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="fx"></canvas>

<header id="topbar">
  <div id="logo">
    <span class="l1 pix">MARVEL</span>
    <span class="l2">PIXEL ROYALE</span>
  </div>
  <nav id="tabs"></nav>
  <div id="hud">
    <div id="coinPill" title="Coins">
      <img id="coinIcon" class="pixel" src="assets/spr/coin.png" alt="coin" width="18" height="18">
      <span id="coinCount">0</span>
    </div>
    <button id="settingsBtn" class="iconbtn" title="Settings">⚙</button>
  </div>
</header>

<main id="screen"></main>

<div id="toasts"></div>
<div id="modalRoot"></div>

<script>
  // Inline (non-module) diagnostics: if the ES module graph or boot ever fails,
  // show the error on-screen instead of a silently empty page.
  (function () {
    function show(msg) {
      var d = document.getElementById('bootErr');
      if (!d) {
        d = document.createElement('pre');
        d.id = 'bootErr';
        d.style.cssText = 'position:fixed;left:0;right:0;bottom:0;margin:0;padding:8px 12px;background:#31060a;color:#ffb4b4;z-index:999;font:12px/1.4 monospace;white-space:pre-wrap;border-top:1px solid #f66';
        document.body.appendChild(d);
      }
      d.textContent = msg;
    }
    window.addEventListener('error', function (e) {
      show('BOOT ERROR: ' + (e.message || 'unknown') + (e.filename ? ' @ ' + e.filename.split('/').pop() + ':' + e.lineno : ''));
    });
    window.addEventListener('unhandledrejection', function (e) {
      show('ASYNC ERROR: ' + ((e.reason && e.reason.message) || e.reason || 'unknown'));
    });
  })();
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
